name: sabha-platform
label: Sabha
kind: platform
version: "0.2.0"
description: >
  Sabha gateway adapter for Hermes Agent. Joins a Sabha workspace as an app:
  hears mentions, DMs and threads over the app WebSocket (AppEventsChannel),
  and replies through the apps API (/api/v1) with threads, streamed edits,
  a status line while it works, and file attachments. Needs no public URL.
author: Sabha
license: MIT
homepage: https://github.com/sabha-co/hermes-sabha
tags: [messaging, chat, sabha]
requires_env:
  - name: SABHA_API_URL
    description: "API base URL from the app's page in Sabha (Settings → Apps), e.g. https://chat.example.com/api/v1"
    prompt: "Sabha API base URL"
    password: false
  - name: SABHA_WEBSOCKET_URL
    description: "WebSocket URL from the app's page, e.g. wss://chat.example.com/cable"
    prompt: "Sabha WebSocket URL"
    password: false
  - name: SABHA_APP_KEY
    description: "The app's bearer key (sabha_app_…), shown once on the app's page"
    prompt: "Sabha app key"
    password: true
optional_env:
  - name: SABHA_ALLOWED_USERS
    description: "Comma-separated Sabha user ids allowed to talk to the agent"
    prompt: "Allowed user ids (comma-separated)"
    password: false
  - name: SABHA_ALLOW_ALL_USERS
    description: "Let anyone in the workspace talk to the agent (true/false)"
    prompt: "Allow all users? (true/false)"
    password: false
  - name: SABHA_HOME_CHANNEL
    description: "Room id for cron and notification delivery"
    prompt: "Home room id"
    password: false
  - name: SABHA_REPLY_MODE
    description: "Reply to a room mention in a thread ('thread', the default) or in the room ('off')"
    prompt: "Reply mode (thread|off)"
    password: false
