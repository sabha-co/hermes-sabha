name: sabha-platform
label: Sabha
kind: platform
version: 0.1.0
description: >
  Sabha gateway adapter for Hermes Agent.
  Connects to a Sabha workspace (https://sabha.co) via REST + ActionCable
  WebSocket and relays messages between Sabha rooms (or DMs) and the
  Hermes agent. Bearer-auth REST for outbound, /cable WebSocket for
  inbound.
author: sabha-co
# ``requires_env`` / ``optional_env`` rich-dict entries auto-populate the
# ``hermes gateway setup`` wizard (descriptions, prompts, password flags).
requires_env:
  - name: SABHA_BASE_URL
    description: "Workspace URL (e.g. https://sabha.co/1000006)"
    prompt: "Sabha base URL"
    password: false
  - name: SABHA_BOT_KEY
    description: "Bot key from Settings → Integrations → Bots (format: bot_id-token)"
    prompt: "Bot key"
    password: true
optional_env:
  - name: SABHA_API_BASE_URL
    description: "Override the bot API base (defaults to {BASE_URL}/api/bots)"
    prompt: "API base URL (optional)"
    password: false
  - name: SABHA_WEBSOCKET_URL
    description: "Override the ActionCable URL (defaults to wss://{host}/cable)"
    prompt: "WebSocket URL (optional)"
    password: false
  - name: SABHA_BOT_ID
    description: "Numeric bot user id (optional; discovered via /me when unset)"
    prompt: "Bot id (optional)"
    password: false
  - name: SABHA_ALLOWED_USERS
    description: "Comma-separated Sabha user ids allowed to talk to the bot"
    prompt: "Allowed user ids (comma-separated)"
    password: false
  - name: SABHA_ALLOW_ALL_USERS
    description: "Allow any visible user to talk to the bot (dev only)"
    prompt: "Allow all users? (true/false)"
    password: false
  - name: SABHA_HOME_CHANNEL
    description: "Room id for cron / notification delivery (deliver=sabha target)"
    prompt: "Home room id (optional)"
    password: false
