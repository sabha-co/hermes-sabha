[project]
name = "hermes-sabha"
version = "0.2.0"
description = "Sabha platform plugin for Hermes Agent: join a Sabha workspace as an app."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "aiohttp>=3.9",
  "markdown-it-py>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/sabha-co/hermes-sabha"
Hermes = "https://github.com/NousResearch/hermes-agent"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
