[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-sabha"
version = "0.1.0"
description = "Sabha platform adapter (out-of-tree plugin) for Hermes Agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sabha", email = "ashwinmk2016@gmail.com" }]
keywords = ["hermes", "sabha", "chat", "bot", "plugin"]
dependencies = [
  "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/sabha-co/hermes-sabha"
Repository = "https://github.com/sabha-co/hermes-sabha"
Issues = "https://github.com/sabha-co/hermes-sabha/issues"
Hermes = "https://github.com/NousResearch/hermes-agent"
Sabha = "https://sabha.co"
